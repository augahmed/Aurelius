<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aurelius Console</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <div class="backdrop backdrop-left"></div>
      <div class="backdrop backdrop-right"></div>

      <header class="hero">
        <div class="brand">
          <span class="brand-mark">A</span>
          <div>
            <p class="eyebrow">Local Transformer Runtime</p>
            <h1>Aurelius Console</h1>
          </div>
        </div>
        <p class="hero-copy">A polished local console for prompt-driven decoding, cache-aware inference, and quick iteration against the Aurelius runtime.</p>
      </header>

      <main class="layout">
        <section class="chat-panel">
          <div class="panel-header">
            <div>
              <p class="panel-label">Conversation</p>
              <h2>Session History</h2>
            </div>
            <button id="clear-history" class="ghost-button" type="button">Clear</button>
          </div>
          <div id="chat-history" class="chat-history" aria-live="polite"></div>
        </section>

        <aside class="control-panel">
          <div class="panel-header">
            <div>
              <p class="panel-label">Controls</p>
              <h2>Generation</h2>
            </div>
          </div>

          <form id="chat-form" class="chat-form">
            <label class="field">
              <span>Prompt</span>
              <textarea id="prompt-input" name="prompt" rows="6" placeholder="Ask Aurelius something concise. Shift+Enter for a newline." required></textarea>
            </label>

            <label class="field">
              <span>Max Tokens</span>
              <input id="max-tokens" name="maxTokens" type="number" min="0" max="32" value="2">
            </label>

            <label class="toggle">
              <input id="use-cache" name="useCache" type="checkbox">
              <span class="toggle-copy">
                <strong>Use KV Cache</strong>
                <small>Ignored when the active backend does not support cached decoding.</small>
              </span>
            </label>

            <div class="form-actions">
              <button id="submit-button" class="primary-button" type="submit">Generate Reply</button>
            </div>

            <p id="status-text" class="status-text" role="status"></p>
          </form>
        </aside>
      </main>
    </div>

    <template id="message-template">
      <article class="message">
        <div class="message-meta"></div>
        <div class="message-body"></div>
      </article>
    </template>

    <script src="/assets/app.js" defer></script>
  </body>
</html>
