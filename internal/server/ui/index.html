<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aurelius Chat</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-frame" aria-label="Aurelius chat interface">
        <header class="top-bar">
          <div class="brand">
            <span class="brand-mark">A</span>
            <div>
              <p class="eyebrow">Local math runtime</p>
              <h1>Aurelius</h1>
            </div>
          </div>
          <div class="top-actions">
            <p id="status-text" class="status-text" role="status"></p>
            <button id="clear-history" class="ghost-button" type="button">Clear chat</button>
          </div>
        </header>

        <div class="conversation-panel">
          <div id="chat-history" class="chat-history" aria-live="polite"></div>
        </div>

        <form id="chat-form" class="composer">
          <label class="prompt-field" for="prompt-input">
            <span class="sr-only">Prompt</span>
            <textarea id="prompt-input" name="prompt" rows="1" placeholder="Ask Aurelius a math question..." required></textarea>
          </label>

          <div class="composer-footer">
            <details class="advanced-controls">
              <summary>Generation controls</summary>
              <div class="control-grid">
                <label class="field">
                  <span>Max tokens</span>
                  <input id="max-tokens" name="maxTokens" type="number" min="0" max="64" value="8">
                </label>

                <label class="field">
                  <span>Temperature</span>
                  <input id="temperature" name="temperature" type="number" min="0" max="1.5" step="0.1" value="0">
                </label>

                <label class="field">
                  <span>Top K</span>
                  <input id="top-k" name="topK" type="number" min="0" max="80" step="1" value="1">
                </label>

                <label class="toggle">
                  <input id="use-cache" name="useCache" type="checkbox" checked>
                  <span>KV cache</span>
                </label>
              </div>
            </details>

            <button id="submit-button" class="primary-button" type="submit">Send</button>
          </div>
        </form>
      </section>
    </main>

    <template id="message-template">
      <article class="message">
        <div class="message-meta"></div>
        <div class="message-body"></div>
      </article>
    </template>

    <script src="/assets/app.js" defer></script>
  </body>
</html>
